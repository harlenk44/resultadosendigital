<title>Pizarra Animaltec</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=JetBrains+Mono:wght@500;700&family=Schibsted+Grotesk:wght@400;500;700&display=swap">
<style>
/* Layout concept: a slate chalkboard. Header with a live Caracas clock, a control bar,
   then the board itself: one chalk colour per lottery, times down the side, results as chalked cells. */
:root {
  --font-display: 'Bungee', Impact, 'Arial Black', sans-serif;
  --font-body: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --bg: #0e1613;
  --board: #14201c;
  --raise: #1b2b26;
  --line: #2c3f38;
  --fg: #ebf1ec;
  --muted: #9bb0a5;
  --now: #f2d16b;
  --now-ink: #1b1606;
  --warn: #ffb4a8;
  --chalk-s: 70%;
  --chalk-l: 68%;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #edf1ee; --board: #ffffff; --raise: #f2f6f3; --line: #d2dbd5; --fg: #13201b;
    --muted: #55675e; --now: #a56d00; --now-ink: #ffffff; --warn: #a3321f;
    --chalk-s: 62%; --chalk-l: 38%; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #edf1ee; --board: #ffffff; --raise: #f2f6f3; --line: #d2dbd5; --fg: #13201b;
  --muted: #55675e; --now: #a56d00; --now-ink: #ffffff; --warn: #a3321f;
  --chalk-s: 62%; --chalk-l: 38%; color-scheme: light;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  padding-block: 16px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--now); outline-offset: 2px; }

.app { max-width: 1800px; margin-inline: auto; display: grid; gap: 14px; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 24px; }
.brand { min-width: 0; }
h1 { margin: 0; font: 400 clamp(1.7rem, 4.6vw, 2.7rem)/1 var(--font-display); letter-spacing: .01em; text-wrap: balance; }
.brand p { margin: 6px 0 0; color: var(--muted); font-size: .95rem; }
.clock { text-align: right; }
.clock b { display: block; font: 400 clamp(1.5rem, 4vw, 2.2rem)/1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--now); }
.clock span { color: var(--muted); font-size: .85rem; text-transform: capitalize; }

/* Controls */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 9px 16px; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--now); color: var(--now-ink); }
.datenav { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.btn { background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 9px 13px; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.icon { padding-inline: 11px; min-width: 40px; }
.btn.primary { background: var(--now); color: var(--now-ink); border-color: var(--now); font-weight: 700; }
input[type="date"], input[type="search"], select {
  background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
}
.spacer { flex: 1 1 0; }
.zoom { display: inline-flex; gap: 4px; }

.note { margin: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--raise); color: var(--muted); font-size: .9rem; }
.note.warn { color: var(--warn); border-color: var(--warn); }
.note[hidden] { display: none; }
.live { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: .85rem; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.live.on i { background: #5fd38a; }

/* Board */
.board { font-size: calc(14px * var(--zoom, 1)); background: var(--board); border: 1px solid var(--line); border-radius: 12px; padding: 1.1em; display: grid; gap: 1.1em; min-width: 0; }
.board h2 { margin: 0; font: 400 1.05em/1.1 var(--font-display); letter-spacing: .02em; }
.datehead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .4em 1em; }
.datehead h2 { font-size: 1.35em; text-transform: capitalize; }
.datehead span { color: var(--muted); font-size: .9em; }

.c { --c: var(--cc, hsl(var(--h) var(--chalk-s) var(--chalk-l))); }

.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(11em, 1fr)); gap: .6em; }
.card { border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line)); border-radius: 10px; padding: .7em .8em; display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: .7em; row-gap: .1em; background: color-mix(in srgb, var(--c) 9%, var(--board)); min-width: 0; }
.card .lot { grid-column: 1 / -1; font-size: .72em; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--c); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .emo { font-size: 2.1em; line-height: 1; }
.card .txt { min-width: 0; }
.card .num { font: 400 calc(1.7em * var(--ns, 1))/1 var(--font-display); color: var(--c); }
.card .nm { font-size: calc(.88em * var(--nn, 1)); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .tm { grid-column: 1 / -1; margin-top: .25em; font: 500 .72em var(--font-mono); color: var(--muted); }
.card.empty { background: transparent; border-style: dashed; }
.card.empty .emo { opacity: .35; filter: grayscale(1); }
.card.empty .nm { color: var(--muted); font-weight: 500; }

.scroller { overflow-x: auto; padding-bottom: .3em; }
.grid { display: grid; gap: .4em; min-width: max-content; }
.grid.day { grid-template-columns: 5.4em repeat(8, minmax(7.4em, 1fr)); }
.grid.week { grid-template-columns: 5.4em repeat(7, minmax(6.4em, 1fr)); }
.hcell { font-size: .74em; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; text-align: center; padding: .5em .3em; color: var(--c); border-bottom: 2px solid var(--c); line-height: 1.2; text-wrap: balance; }
.hcell.dim { color: var(--muted); border-bottom-color: var(--line); }
.hcell.today { color: var(--now); border-bottom-color: var(--now); }
.hcell small { display: block; font: 400 1.9em/1.1 var(--font-display); letter-spacing: 0; margin-top: .1em; }
.corner { position: sticky; left: 0; background: var(--board); z-index: 1; }
.tcell { position: sticky; left: 0; z-index: 1; background: var(--board); display: flex; align-items: center; justify-content: flex-start; font: 500 .8em var(--font-mono); color: var(--muted); padding-right: .4em; white-space: nowrap; }
.tcell.now { color: var(--now); font-weight: 700; }
.tcell.now::before { content: ""; width: .5em; height: .5em; border-radius: 50%; background: var(--now); margin-right: .45em; flex: none; }

.cell { display: grid; justify-items: center; align-content: center; gap: .1em; min-height: 4.7em; background: transparent; border: 1px dashed var(--line); border-radius: 8px; padding: .35em .2em; color: var(--muted); min-width: 0; }
.cell.rowNow { border-color: color-mix(in srgb, var(--now) 60%, var(--line)); }
.cell.future { opacity: .55; }
.cell.has { border: 1px solid color-mix(in srgb, var(--c) 55%, var(--line)); background: color-mix(in srgb, var(--c) 14%, var(--board)); color: var(--fg); }
.cell .emo { font-size: 1.5em; line-height: 1; }
.cell .num { font: 400 calc(1.2em * var(--ns, 1))/1 var(--font-display); color: var(--c); }
.cell .nm { font-size: calc(.72em * var(--nn, 1)); font-weight: 500; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .dash { font-size: 1.1em; }
.grid.week .cell { min-height: 3.9em; }
.grid.week .cell .nm { display: none; }
button.cell:hover { border-color: var(--c); }
div.cell { cursor: default; }
.cell.off { border: 0; background: transparent; }
.schedrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(9em, 1fr)); gap: 8px 12px; align-items: end; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.schedrow b { grid-column: 1 / -1; color: var(--c); font-size: .9rem; }
.schedrow label { display: grid; gap: 4px; font-size: .8rem; color: var(--muted); }

.chips { display: flex; flex-wrap: wrap; gap: .45em; }
.chip { background: transparent; border: 1px solid color-mix(in srgb, var(--c) 50%, var(--line)); color: var(--fg); border-radius: 999px; padding: .4em .9em; font-size: .85em; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--board); font-weight: 700; }

.freq { display: grid; gap: .5em; }
.freq ol { list-style: none; margin: 0; padding: 0; display: grid; gap: .4em; grid-template-columns: repeat(auto-fill, minmax(15em, 1fr)); }
.freq li { display: grid; grid-template-columns: 2em 3em 1fr auto; align-items: center; gap: .5em; background: var(--raise); border-radius: 8px; padding: .45em .7em; position: relative; overflow: hidden; }
.freq li .bar2 { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--c) 22%, transparent); z-index: 0; }
.freq li > * { position: relative; z-index: 1; }
.freq .emo { font-size: 1.4em; }
.freq .num { font: 400 calc(1.05em * var(--ns, 1)) var(--font-display); color: var(--c); }
.freq .nm { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.freq .ct { font: 700 .85em var(--font-mono); }
.muted { color: var(--muted); margin: 0; font-size: .9em; }

/* Pantalla (TV): 8 tarjetas grandes, sin scroll, medidas relativas al tamaño de la pantalla */
.board.tvview { font-size: calc(min(1vw, 1.78vh) * var(--zoom, 1)); }
.tvgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(22em, auto); gap: .9em; min-height: 0; }
.tvcard { border: 2px solid color-mix(in srgb, var(--c) 55%, var(--line)); border-radius: 1em; background: color-mix(in srgb, var(--c) 8%, var(--board)); padding: .9em 1em; display: grid; grid-template-rows: auto 1fr auto; gap: .6em; min-width: 0; min-height: 0; overflow: hidden; }
.tvcard header { display: flex; justify-content: space-between; align-items: baseline; gap: .2em .6em; flex-wrap: wrap; }
.tvcard h3 { margin: 0; font: 400 1.25em/1.1 var(--font-display); color: var(--c); letter-spacing: .02em; text-transform: uppercase; min-width: 0; text-wrap: balance; }
.tvcard header span { font: 500 .8em var(--font-mono); color: var(--muted); }
.tvmain { display: flex; align-items: center; gap: .8em; min-height: 0; min-width: 0; }
.bigemo { font-size: 5.2em; line-height: 1; flex: none; }
.bigemo.off { opacity: .3; filter: grayscale(1); }
.bigtxt { display: grid; gap: .1em; min-width: 0; }
.bignum { font: 400 calc(4.2em * var(--ns, 1))/1 var(--font-display); color: var(--c); }
.bigname { font-size: calc(1.7em * var(--nn, 1)); font-weight: 700; line-height: 1.1; overflow-wrap: anywhere; }
.bigtime { font: 500 .85em var(--font-mono); color: var(--muted); }
.tvchips { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(5.2em, 1fr)); gap: .35em; }
.tvchips li { display: grid; justify-items: center; gap: .05em; padding: .3em .2em; border: 1px dashed var(--line); border-radius: .5em; color: var(--muted); min-width: 0; }
.tvchips li i { font: 500 .62em var(--font-mono); font-style: normal; white-space: nowrap; }
.tvchips li b { font: 700 calc(.95em * var(--ns, 1)) var(--font-body); white-space: nowrap; }
.tvchips li.has { border: 1px solid color-mix(in srgb, var(--c) 50%, var(--line)); color: var(--fg); background: color-mix(in srgb, var(--c) 12%, var(--board)); }
.tvchips li.cur { border-color: var(--now); box-shadow: 0 0 0 2px var(--now); }
@media (max-width: 1000px) {
  .tvgrid { grid-template-columns: repeat(auto-fill, minmax(20em, 1fr)); }
  .board.tvview { font-size: calc(14px * var(--zoom, 1)); }
}
html.tvroot, html.tvroot body { overflow: hidden; }
html.tvroot body { padding-block: 10px; }
.app.tv { height: calc(100vh - 20px); display: flex; flex-direction: column; gap: .7em; max-width: none; }
.app.tv .board { flex: 1 1 0; min-height: 0; grid-template-rows: minmax(0, 1fr); }
.app.tv .top { flex: none; }
.app.tv .ad { flex: none; height: 10vh; max-height: none; }
.app.tv:fullscreen, .app.tv:-webkit-full-screen { height: 100vh; background: var(--bg); color: var(--fg); box-sizing: border-box; padding: 10px max(16px, env(safe-area-inset-right, 0px)); overflow: hidden; }
.app.tv .ad img { max-height: none; }
.app.tv .board.tvview { border: 0; background: transparent; padding: 0; }
.app.tv .tvgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); grid-auto-rows: auto; height: 100%; }
.app.tv h1 { font-size: clamp(2rem, 3.4vw, 4.5rem); }
.app.tv .clock b { font-size: clamp(2rem, 3.4vw, 4.5rem); }
.app.tv .clock span { font-size: clamp(1rem, 1.4vw, 1.8rem); }

/* Modal */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal[hidden] { display: none; }
.ad { display: grid; place-items: center; background: var(--board); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0; }
.ad[hidden], .app.tv .ad[hidden] { display: none; }
.ad a { display: grid; width: 100%; height: 100%; place-items: center; }
.ad img { display: block; width: 100%; height: 100%; max-height: 150px; object-fit: contain; }
.adrow { display: grid; grid-template-columns: 7em 1fr auto; gap: 8px; align-items: center; }
.adrow .thumb { width: 7em; height: 3em; object-fit: contain; background: var(--raise); border: 1px solid var(--line); border-radius: 6px; }
.adrow input[type="url"], .adrow input[type="text"] { min-width: 0; width: 100%; background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
.adzone { display: grid; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.adzone h4 { margin: 0; font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.adzone label.btn { display: inline-block; justify-self: start; padding: 7px 12px; font-size: .88rem; color: var(--fg); cursor: pointer; }
.adzone label.btn:focus-within { outline: 2px solid var(--now); outline-offset: 2px; }
.adzone input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
@media (max-width: 560px) { .adrow { grid-template-columns: 5em 1fr; } .adrow .btn { grid-column: 1 / -1; justify-self: start; } .adrow .thumb { width: 5em; } }
.logo { height: 1.7em; width: auto; max-width: 5.5em; object-fit: contain; vertical-align: middle; margin-right: .45em; }
.card .lot .logo { height: 1.9em; }
.hcell .logo { display: block; margin: 0 auto .35em; height: 2.6em; max-width: 100%; }
.tvcard h3 { display: flex; align-items: center; gap: .1em; }
.tvcard .logo { height: 2.8em; max-width: 7em; }
.tvcard header h3 span { font: inherit; color: inherit; }
.datehead .logo { height: 1.9em; margin: 0 0 0 .5em; }
.lgrow { display: grid; grid-template-columns: 3.4em 1fr auto auto; gap: 8px; align-items: center; }
.lgrow .thumb { height: 2.6em; width: 3.4em; object-fit: contain; background: var(--raise); border: 1px solid var(--line); border-radius: 6px; }
.lgrow .thumb.none { display: grid; place-items: center; font-size: .65rem; color: var(--muted); text-align: center; }
.lgrow span.n { font-size: .85rem; min-width: 0; overflow-wrap: anywhere; }
.lgrow input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.lgrow label.btn { display: inline-block; padding: 6px 11px; font-size: .85rem; color: var(--fg); cursor: pointer; }
.lgrow label.btn:focus-within { outline: 2px solid var(--now); outline-offset: 2px; }
.modal.look { background: transparent; pointer-events: none; place-items: start end; }
.modal.look .panel { pointer-events: auto; width: min(400px, 100%); max-height: calc(100vh - 32px); box-shadow: 0 10px 40px rgba(0,0,0,.45); }
.lk { display: grid; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.lk h4 { margin: 0; font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.lk .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(8.5em, 1fr)); gap: 8px 12px; }
.lk label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); min-width: 0; }
.lk label.inl { grid-template-columns: 1fr auto; align-items: center; }
.lk input[type="color"] { width: 100%; min-width: 2.6em; height: 2.2em; padding: 2px; background: var(--raise); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.lk label.inl input[type="color"] { width: 3.2em; }
.lk input[type="range"] { width: 100%; accent-color: var(--now); }
.lk output { color: var(--fg); font: 500 .8rem var(--font-mono); }
.lk .presets { display: flex; flex-wrap: wrap; gap: 6px; }
.panel { background: var(--board); border: 1px solid var(--line); border-radius: 12px; width: min(720px, 100%); max-height: 100%; overflow: auto; padding: 18px; display: grid; gap: 14px; font-size: 14px; }
.panel header { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.panel h3 { margin: 0; font: 400 1.15rem/1.15 var(--font-display); }
.panel header p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; text-transform: capitalize; }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(6em, 1fr)); gap: 6px; }
.pick { display: grid; justify-items: center; gap: 2px; padding: 8px 4px; background: var(--raise); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.pick:hover { border-color: var(--c); }
.pick[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 22%, var(--raise)); }
.pick .emo { font-size: 1.6rem; line-height: 1; }
.pick .num { font: 400 .95rem var(--font-display); color: var(--c); }
.pick .nm { font-size: .72rem; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fields { display: flex; flex-wrap: wrap; gap: 14px; }
.fields label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 500; z-index: 60; max-width: calc(100% - 32px); }
.toast[hidden] { display: none; }

/* TV mode */
.exitTV { display: none; }
.app.tv .bar, .app.tv .note, .app.tv .brand p { display: none; }
.app.tv .board { border-radius: 0; }
.app.tv .exitTV { display: inline-flex; position: fixed; top: max(10px, env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); z-index: 20; opacity: .55; }
.app.tv .exitTV:hover, .app.tv .exitTV:focus-visible { opacity: 1; }
.app.tv .clock { padding-right: 90px; }

@media (max-width: 560px) {
  .clock { text-align: left; }
  .spacer { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .cell, .card, .pick, .btn { transition: border-color .15s, background-color .15s; }
}
/* Triples: mismas tarjetas grandes que la pantalla de animalitos, con 3 cifras y signo */
.tvgrid.trip { grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); }
.app.tv .tvgrid.trip { grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); grid-template-rows: repeat(var(--rows, 2), minmax(0, 1fr)); }
.tvcard.trip .bignum { letter-spacing: .06em; font-size: calc(4.4em * var(--ns, 1)); }
.tvchips li[data-tg] { cursor: pointer; }
.tvchips li[data-tg]:hover, .tvchips li[data-tg]:focus-visible { border-color: var(--c); }
.tvchips li.has b { letter-spacing: .02em; }
@media (max-width: 1000px) { .tvgrid.trip, .app.tv .tvgrid.trip { grid-template-columns: repeat(auto-fill, minmax(20em, 1fr)); grid-template-rows: none; } }
/* Barra de avance de la alternancia entre pizarras (solo en pantalla completa) */
.prog { display: none; align-items: center; gap: .8em; }
.app.tv .prog:not([hidden]) { display: flex; }
.prog span { font: 700 .8rem var(--font-body); text-transform: uppercase; letter-spacing: .1em; color: var(--now); white-space: nowrap; }
.prog i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); position: relative; overflow: hidden; }
.prog i::after { content: ""; position: absolute; inset: 0; background: var(--now); transform: scaleX(0); transform-origin: left; }
.prog.run i::after { animation: progress var(--dur, 20s) linear forwards; }

    var lc = e.target.closest('[data-logoclear]'); if (lc) { saveLogo(lc.getAttribute('data-logoclear'), null); return; }
    var pr = e.target.closest('[data-preset]'); if (pr) { applyPreset(pr.getAttribute('data-preset')); return; }
    if (e.target.closest('[data-resetchalk]')) { look.chalk = {}; saveLook(); renderBoard(); syncLookInputs(); return; }
    if (e.target.closest('[data-resetlook]')) { resetLook(); return; }
    if (e.target.closest('[data-saveslots]')) {
      var next = {}, bad = '';
      LOTTERIES.forEach(function (L) {
        var f = +$('panel').querySelector('[data-sf="' + L.id + '"]').value, t2 = +$('panel').querySelector('[data-st="' + L.id + '"]').value;
        if (f > t2) bad = L.name;
        next[L.id] = { from: f, to: t2 };
      });
      if (bad) { $('slotMsg').textContent = 'En ' + bad + ' el primer sorteo debe ser antes del último.'; return; }
      closeModal(); saveSched(next);
    }
  });
  $('modal').addEventListener('change', function (e) {
    var tt = e.target;
    if (tt.id === 'adSec') { saveAdSec(+tt.value); return; }
    if (tt.hasAttribute && tt.hasAttribute('data-adlink')) {
      var lid = tt.getAttribute('data-adlink'), la = ads.filter(function (x) { return x.id === lid; })[0], link = tt.value.trim();
      if (!la) return;
      if (!okLink(link)) { toast('El enlace debe empezar con http:// o https://'); tt.value = la.l || ''; return; }
      saveAdDoc(Object.assign({}, la, { l: link })); return;
    }
    if (tt.hasAttribute && tt.hasAttribute('data-adfile')) {
      var zone = tt.getAttribute('data-adfile'), file = tt.files && tt.files[0];
      if (!file) return;
      if (!/^image\//.test(file.type)) { toast('Elige un archivo de imagen.'); tt.value = ''; return; }
      if (adsIn(zone).length >= 6) { toast('Cada zona admite hasta 6 anuncios.'); tt.value = ''; return; }
      var tryQ = function (maxW, maxH, q) {
        return resizeLogo(file, maxW, maxH, q).then(function (u) { return okLogo(u) ? u : (q > .5 ? tryQ(Math.round(maxW * .8), Math.round(maxH * .8), q - .15) : Promise.reject(new Error('size'))); });
      };
      tryQ(2000, 400, .85).then(function (u) {
        var now = Date.now();
        return saveAdDoc({ id: 'a' + now.toString(36) + Math.random().toString(36).slice(2, 6), z: zone, u: u, l: '', o: now, _new: true });
      }).catch(function () { toast('No se pudo usar esa imagen. Prueba con otra.'); });
      return;
    }
    var t = e.target, id = t.getAttribute && t.getAttribute('data-logo');
    if (!id || !t.files || !t.files[0]) return;
    var f = t.files[0];
    if (!/^image\//.test(f.type)) { toast('Elige un archivo de imagen.'); t.value = ''; return; }
    resizeLogo(f).then(function (u) { if (!okLogo(u)) throw new Error('size'); return saveLogo(id, u); })
      .catch(function () { toast('No se pudo usar esa imagen. Prueba con otra.'); });
  });
  $('modal').addEventListener('input', function (e) {
    if (onLookInput(e)) return;
    if (e.target.id === 'pickSearch') $('picks').innerHTML = picksHTML(e.target.value);
    if (e.target.id === 'triNum') e.target.value = e.target.value.replace(/\D/g, '').slice(0, 3);
  });
  $('modal').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'triNum') { e.preventDefault(); submitTriple(); return; }
    if (e.key === 'Enter' && e.target.id === 'pickSearch') {
      var btns = $('picks').querySelectorAll('.pick');
      if (btns.length === 1 && picker) { var p = picker; var n = +btns[0].getAttribute('data-n'); closeModal(); saveResult(p.d, p.g, p.t, n); }
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('modal').hidden) closeModal();
    if (state.tv && $('modal').hidden) {
      if (e.key === '+' || e.key === '=') setZoom(state.zoom + .1);
      if (e.key === '-') setZoom(state.zoom - .1);
    }
  });

  window.addEventListener('hashchange', function () {
    var v = location.hash === '#semanal' ? 'week' : location.hash === '#diario' ? 'day' : location.hash === '#pantalla' ? 'tv' : location.hash === '#triples' ? 'triples' : null;
    if (v && v !== state.view) { state.view = v; subscribeWeek(); render(); }
  });

  /* ---------- Boot ---------- */
  var startHash = window.__PZ_HASH || location.hash;
  if (startHash === '#semanal') state.view = 'week'; else if (startHash === '#pantalla') state.view = 'tv'; else if (startHash === '#triples') state.view = 'triples';
  applyLook();
  tick(); render(); restartAdTimer();
  setInterval(tick, 1000);

  (async function connect() {
    try {
      if (!window.claude || !window.claude.use) { render(); return; }
      var res = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      db = res[0]; var user = res[1];
      if (!db) { render(); return; }
      mode = 'shared';
      if (user && typeof user.can === 'function') { var w = await user.can('data.write'); if (w === false) canWrite = false; }
      db.doc('config/schedule').onSnapshot(function (snap) {
        var v = snap.exists ? snap.data() : null;
        if (v && v.s && typeof v.s === 'object') { applySched(v.s); render(); }
      }, function () {});
      db.doc('config/triples').onSnapshot(function (snap) {
        var v = snap.exists ? snap.data() : null;
        if (v && typeof v === 'object') { applyTcfg(v); startRot(); render(); }
      }, function () {});
      db.collection('logos').limit(50).onSnapshot(function (snap) {
        var m = {};
        snap.docs.forEach(function (doc) { var v = doc.data() || {}; if (lotById(doc.id) && okLogo(v.u)) m[doc.id] = v.u; });
        logosShared = m; mergeLogos(); renderBoard(); refreshLogoRows();
      }, function () {});
      db.collection('ads').limit(40).onSnapshot(function (snap) {
        adsShared = snap.docs.map(function (doc) { var v = doc.data() || {}; return { id: doc.id, z: v.z, u: v.u, l: typeof v.l === 'string' ? v.l : '', o: Number(v.o) || 0 }; }).filter(function (a) { return okAd(a) && okLink(a.l); });
        mergeAds(); renderAds(); refreshAdRows();
      }, function () {});
      db.doc('config/adsettings').onSnapshot(function (snap) {
        var v = snap.exists ? snap.data() : null;
        if (v && Number(v.sec) >= 3 && Number(v.sec) <= 600) { adSec = Number(v.sec); restartAdTimer(); }
      }, function () {});
      subscribeWeek();
      render();
    } catch (e) { mode = 'local'; db = null; render(); }
  })();
})();
</script>
